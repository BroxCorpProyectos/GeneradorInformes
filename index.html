<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Generador de Informes</title>

<style>

:root {
  --azul: #16273f;
  --azul2: #1f3a5f;
  --ambar: #f2a93b;
  --fondo: #f4f6f9;
  --borde: #dbe1e8;
  --texto: #1f2937;
  --verde: #2e7d32;
  --rojo: #c0392b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--fondo);
  color: var(--texto);
}

header {
  background:
    linear-gradient(
      135deg,
      var(--azul),
      var(--azul2)
    );

  color: white;
  padding: 30px 20px;
}

.contenedor {
  max-width: 700px;
  margin: 30px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow:
    0 5px 20px
    rgba(0,0,0,.08);
}

h1 {
  margin: 0;
}

h2 {
  color: var(--azul);
}

label {
  display: block;
  font-weight: bold;
  margin-top: 15px;
  margin-bottom: 6px;
}

input,
select,
textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid var(--borde);
  border-radius: 8px;
  font-size: 16px;
}

textarea {
  min-height: 100px;
}

button {
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: 0;
  border-radius: 8px;
  background: var(--ambar);
  color: var(--azul);
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
}

.resultado {
  padding: 15px;
  border-radius: 8px;
  margin-top: 20px;
}

.ok {
  background: #eaf7ec;
  color: var(--verde);
}

.error {
  background: #fdecea;
  color: var(--rojo);
}

.oculto {
  display: none;
}

</style>

</head>

<body>

<header>

<h1>
Generador de Informe de Cierre
</h1>

<p>
Desimplementación de proyectos
</p>

</header>


<div class="contenedor">

<div class="card">

<h2>
Datos del proyecto
</h2>


<label>
Proyecto
</label>

<select id="proyecto">

<option value="125977">
125977 - Arequipa
</option>

</select>


<label>
Responsable
</label>

<input
  id="responsable"
  value="Juan Pérez"
>


<label>
Fecha de ejecución
</label>

<input
  id="fecha"
  value="12/08/2026 al 14/08/2026"
>


</div>


<div class="card">

<h2>
Restauración
</h2>


<label>
¿Se realizó pintado?
</label>

<select id="pintado">

<option value="si">
Sí
</option>

<option value="no">
No
</option>

</select>


<label>
Área pintada (m²)
</label>

<input
  id="areaPintada"
  type="number"
  value="125"
>


<label>
Tipo de pintura
</label>

<input
  id="tipoPintura"
  value="Pintura látex"
>


<label>
Color
</label>

<input
  id="color"
  value="Gris RAL 7035"
>


</div>


<div class="card">

<h2>
Generar informe
</h2>

<p>
El sistema buscará automáticamente las evidencias
del proyecto y generará el informe.
</p>


<button
  id="btnGenerar"
  onclick="generarInforme()"
>

GENERAR INFORME PDF

</button>


<div
  id="resultado"
  class="resultado oculto"
>
</div>

</div>

</div>

<script>

const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwFBRK977J-UWdF9BMZNIw92uPmHc8MW2427C7rgbYHkKTHFqgK99Swlow_wO6UqCTd/exec";

function generarInforme() {

  const boton =
    document.getElementById("btnGenerar");

  const resultado =
    document.getElementById("resultado");


  boton.disabled = true;

  resultado.className =
    "resultado";

  resultado.innerHTML =
    "Generando informe...";


  const datos = {

    proyecto:
      document.getElementById("proyecto").value,

    responsable:
      document.getElementById("responsable").value,

    fecha:
      document.getElementById("fecha").value,

    pintado:
      document.getElementById("pintado").value,

    areaPintada:
      document.getElementById("areaPintada").value,

    tipoPintura:
      document.getElementById("tipoPintura").value,

    color:
      document.getElementById("color").value

  };


  fetch(
    URL_APPS_SCRIPT,
    {
      method: "POST",

      headers: {
        "Content-Type":
          "text/plain;charset=utf-8"
      },

      body:
        JSON.stringify(datos)

    }
  )

  .then(
    response =>
      response.json()
  )

  .then(
    data => {

      if (
        data.resultado !== "OK"
      ) {

        throw new Error(
          data.mensaje ||
          "No se pudo generar el informe."
        );

      }


      resultado.className =
        "resultado ok";


      resultado.innerHTML = `

        <strong>
        Informe generado correctamente.
        </strong>

        <br><br>

        <a
          href="${data.documentoUrl}"
          target="_blank"
        >
          Abrir Google Docs
        </a>

        <br><br>

        <a
          href="${data.pdfUrl}"
          target="_blank"
        >
          Abrir PDF
        </a>

      `;

    }
  )

  .catch(
    error => {

      resultado.className =
        "resultado error";

      resultado.innerHTML =
        "Error: " +
        error.message;

    }
  )

  .finally(
    () => {

      boton.disabled = false;

    }
  );

}

</script>

</body>

</html>
